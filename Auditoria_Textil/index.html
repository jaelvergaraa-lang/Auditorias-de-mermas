<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoría Textil - Mermas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <main class="container">
        <h1 class="h2 text-dark border-bottom pb-2">✂️ Control de Calidad: Mermas de Corte</h1>

        <div class="row g-3 mt-2">
            <div class="col-md-4">
                <form id="formAuditoria" class="card p-3 border-dark shadow-sm">
                    <label for="idRollo" class="form-label">ID del rollo</label>
                    <input type="text" id="idRollo" class="form-control mb-2" required>

                    <label for="mtsTotales" class="form-label">Metros totales</label>
                    <input type="number" id="mtsTotales" class="form-control mb-2" min="0" step="any" required>

                    <label for="mtsDefecto" class="form-label">Metros con defecto</label>
                    <input type="number" id="mtsDefecto" class="form-control mb-3" min="0" step="any" required>

                    <button id="btnAuditar" type="submit" class="btn btn-dark w-100">Guardar Auditoría</button>
                </form>
            </div>

            <div class="col-md-8">
                <div class="table-responsive">
                    <table class="table table-bordered bg-white">
                        <thead class="table-secondary">
                            <tr>
                                <th scope="col">Rollo</th>
                                <th scope="col">Mts Totales</th>
                                <th scope="col">% Merma</th>
                                <th scope="col">Estado de Calidad</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMermas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
